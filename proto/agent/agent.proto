syntax = "proto3";
package agent;
option go_package = "runman-v2/proto/agent";
//protoc --go_out=. --go_opt=paths=source_relative --go-grpc_out=. --go-grpc_opt=paths=source_relative proto/agent/agent.proto
// ================================================================
// AgentGateway — Agent 与平台之间的双向流式通信服务。
// Agent 主动连接，通过 gRPC metadata 的 authorization 字段携带
// Bearer <agent_token> 完成身份验证。
// ================================================================

service AgentGateway {
  // Agent 主动调用此方法建立持久化双向流。
  // 连接断开后 Agent 应自动重连，平台侧会重放未确认的命令。
  rpc Connect(stream AgentEnvelope) returns (stream PlatformEnvelope);
}

// ================================================================
// 公共枚举
// ================================================================

// VM 运行状态（Agent 只上报运行时状态，到期/删除由平台侧管理）
enum VMStatus {
  VM_STATUS_UNSPECIFIED = 0; // 未知
  VM_STATUS_CREATING    = 1; // 创建中（等待 Agent 回报）
  VM_STATUS_RUNNING     = 2; // 运行中
  VM_STATUS_STOPPED     = 3; // 已停止
  VM_STATUS_ERROR       = 4; // 异常
}

// 端口转发协议
enum Protocol {
  PROTOCOL_UNSPECIFIED = 0;
  PROTOCOL_TCP         = 1;
  PROTOCOL_UDP         = 2;
}

// ================================================================
// 上行消息：Agent → Platform
// ================================================================

// Agent 发往平台的信封，每条消息携带唯一 message_id 用于追踪。
message AgentEnvelope {
  // 客户端生成的唯一消息 ID（用于去重 / 链路追踪）
  string message_id = 1;

  oneof payload {
    Heartbeat       heartbeat     = 2; // 心跳（每 30 秒上报一次）
    CommandResult   cmd_result    = 4; // 平台命令的执行结果
    PortForwardList port_fwd_list = 5; // CmdGetPortForwards 的响应
  }
}

// 心跳包 — 携带宿主机实时负载与 VM 摘要列表。
message Heartbeat {
  int64  timestamp    = 1; // Unix 秒
  float  cpu_pct      = 2; // CPU 使用率（0-100）
  int64  ram_used_mb  = 3; // 已用内存（MB）
  int64  disk_used_gb = 4; // 已用磁盘（GB）
  int64  net_in_bps   = 5; // 宿主机实时入口速率（bytes/s）
  int64  net_out_bps  = 6; // 宿主机实时出口速率（bytes/s）
  float  load1        = 11; // 系统负载 (1 min)
  float  load5        = 12; // 系统负载 (5 min)
  float  load15       = 13; // 系统负载 (15 min)
  int64  uptime       = 14; // 系统运行时间 (秒)
  int32  cpus         = 15; // 逻辑 CPU 核数
  int64  ram_total_mb = 16; // 总内存 (MB)
  int64  disk_total_gb = 17; // 总磁盘 (GB)
  int32  bandwidth_mbps = 18; // 总带宽 (Mbps)
  string virt_type      = 19; // 虚拟化类型 (podman / cloudhv)

  // 当前宿主机上所有 VM 的简要状态，用于平台侧对账。
  repeated VMSummary vms = 7;

  // 宿主机入口地址（IPv4 / DDNS 域名），变化时才需要填写。
  string entry_host  = 8;
  // 宿主机 IPv6 地址（可选），变化时才需要填写。
  string entry_ipv6  = 9;

  // 宿主机支持的操作系统镜像列表。
  repeated OSImageInfo os_images = 10;
}

// 操作系统镜像信息
message OSImageInfo {
  string id   = 1; // 镜像唯一标识符
  string name = 2; // 镜像显示名称
}

// VM 状态摘要（心跳中内嵌）
message VMSummary {
  string   vm_id           = 1; // VM UUID
  VMStatus status          = 2; // 当前状态
  float    cpu_pct         = 3; // CPU 使用率（0-100）
  int64    ram_used_mb     = 4; // 已用内存（MB）
  int64    traffic_in_bytes  = 5; // 累计入站流量（bytes，自 VM 创建起）
  int64    traffic_out_bytes = 6; // 累计出站流量（bytes，自 VM 创建起）
  string   ip                = 7; // VM 内部/公网 IP
  int64    monthly_traffic_in  = 8; // 本月累计入站流量 (bytes)
  int64    monthly_traffic_out = 9; // 本月累计出站流量 (bytes)
}

// CmdGetPortForwards 的响应，携带 command_id 与请求关联
message PortForwardList {
  string                  command_id = 1;
  repeated PortForwardEntry entries  = 2;
}

// 端口转发规则条目
message PortForwardEntry {
  string   vm_id       = 1; // VM UUID
  Protocol protocol    = 2; // 协议
  int32    host_port   = 3; // 宿主机端口
  int32    guest_port  = 4; // VM 内部端口
  string   description = 5; // 备注
}

// 平台命令的执行结果
message CommandResult {
  string command_id = 1; // 对应 PlatformEnvelope.command_id
  bool   success    = 2; // 是否成功
  string error      = 3; // 失败原因（success=false 时填写）
  bytes  data       = 4; // JSON 编码的附加结果数据
}

// ================================================================
// 下行消息：Platform → Agent
// ================================================================

// 平台发往 Agent 的信封，每条命令携带唯一 command_id。
// Agent 执行完毕后须通过 CommandResult 回报结果。
message PlatformEnvelope {
  // 平台生成的唯一命令 ID（持久化到 DB，用于重放）
  string command_id = 1;

  reserved 10, 11; // 10: 原 get_vm_info；11: 原 sync_port_fwds，已废弃，禁止复用

  oneof payload {
    CmdCreateVM         create_vm       = 2;  // 创建 VM
    CmdStartVM          start_vm        = 3;  // 启动 VM
    CmdStopVM           stop_vm         = 4;  // 关闭 VM
    CmdRestartVM        restart_vm      = 5;  // 重启 VM
    CmdDeleteVM         delete_vm       = 6;  // 销毁 VM
    CmdResetPassword    reset_password  = 7;  // 重置 root 密码
    CmdSetPortForward   set_port_fwd    = 8;  // 新增单条端口转发规则
    CmdDelPortForward   del_port_fwd    = 9;  // 删除单条端口转发规则
    CmdUpdateVM         update_vm       = 12; // 修改 VM 配置 (机主/管理员)
    CmdReinstallVM      reinstall_vm    = 13; // 重装 VM 系统
    CmdGetPortForwards  get_port_fwds   = 14; // 查询某 VM 的端口转发规则列表
    Ping                ping            = 15; // 服务端保活 ping，agent 忽略即可
  }
}

// 服务端定期下发的保活消息，用于维持 CF 代理的下行连接活跃。
message Ping {}

// 重装 VM
message CmdReinstallVM {
  string vm_id          = 1; // VM UUID
  string os_image       = 2; // 新操作系统镜像 ID
  string root_password  = 3; // 新 root 密码
  int32  cpu            = 4; // CPU 核数
  int64  ram_mb         = 5; // 内存（MB）
  int64  disk_gb        = 6; // 磁盘（GB）
  int32  bandwidth_mbps = 7; // 带宽限速（Mbps）
}

// 修改 VM 配置
message CmdUpdateVM {
  string vm_id          = 1; // VM UUID
  int32  cpu            = 2; // 新 CPU 核数 (0 表示不修改)
  int64  ram_mb         = 3; // 新内存 MB (0 表示不修改)
  int64  disk_gb        = 4; // 新磁盘 GB (0 表示不修改)
  int32  bandwidth_mbps = 5; // 新带宽 Mbps (负数表示不修改)
}

// 创建 VM
message CmdCreateVM {
  string vm_id          = 1; // VM UUID（Agent 侧用作标识符）
  int32  cpu            = 2; // CPU 核数
  int64  ram_mb         = 3; // 内存（MB）
  int64  disk_gb        = 4; // 磁盘（GB）
  int32  bandwidth_mbps = 5; // 带宽限速（Mbps），0 = 不限
  string os_image       = 6; // 操作系统镜像 ID / 名称
  string root_password  = 7; // root 初始密码
}

// 启动 VM
message CmdStartVM {
  string vm_id = 1; // VM UUID
}

// 关闭 VM
message CmdStopVM {
  string vm_id = 1; // VM UUID
  bool   force = 2; // true = 强制关机（等同于断电）
}

// 重启 VM
message CmdRestartVM {
  string vm_id = 1; // VM UUID
}

// 销毁 VM（不可恢复，释放所有资源）
message CmdDeleteVM {
  string vm_id = 1; // VM UUID
}

// 重置 root 密码
message CmdResetPassword {
  string vm_id        = 1; // VM UUID
  string new_password = 2; // 新密码（明文，Agent 负责写入）
}

// 新增端口转发规则（宿主机端口 → VM 内部端口）
message CmdSetPortForward {
  string   vm_id       = 1; // VM UUID
  Protocol protocol    = 2; // 协议
  int32    host_port   = 3; // 宿主机端口（1024-65535）
  int32    guest_port  = 4; // VM 内部端口
  string   description = 5; // 备注，例如 "SSH"、"Web"
}

// 删除端口转发规则
message CmdDelPortForward {
  string   vm_id     = 1; // VM UUID
  Protocol protocol  = 2; // 协议
  int32    host_port = 3; // 要删除的宿主机端口
}

// 查询某 VM 的端口转发规则列表（结果通过 CommandResult.data JSON 回传）
message CmdGetPortForwards {
  string vm_id = 1; // VM UUID
}