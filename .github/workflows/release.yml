name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-agent:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Agent
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build \
            -tags containers_image_openpgp \
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o runman-agent-linux-${{ matrix.goarch }} \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: runman-agent-linux-${{ matrix.goarch }}
          path: runman-agent-linux-${{ matrix.goarch }}
          retention-days: 1

  build-rfw:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
            cc: musl-gcc
            linker: musl-gcc
          - target: aarch64-unknown-linux-musl
            arch: arm64
            cc: aarch64-linux-musl-gcc
            linker: aarch64-linux-musl-gcc

    steps:
      - uses: actions/checkout@v4
        with:
          repository: narwhal-cloud/rfw
          ref: dev

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools zstd

      - name: Install aarch64 musl cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          curl -fsSL https://musl.cc/aarch64-linux-musl-cross.tgz | tar -xz -C /tmp
          echo "/tmp/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH

      - name: Setup Rust toolchain
        run: |
          rustup toolchain install stable
          rustup toolchain install nightly --component rust-src
          rustup target add --toolchain stable ${{ matrix.target }}

      - name: Install bpf-linker
        run: |
          mkdir -p ~/.cargo/bin
          curl -fsSL https://github.com/aya-rs/bpf-linker/releases/download/v0.11.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst | zstd -d | tar -x -C ~/.cargo/bin
          if [ -d ~/.cargo/bin/bpf-linker-* ]; then
            cp -f ~/.cargo/bin/bpf-linker-*/bpf-linker ~/.cargo/bin/ 2>/dev/null || true
          fi
          chmod +x ~/.cargo/bin/bpf-linker
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build rfw
        env:
          CC: ${{ matrix.cc }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: ${{ matrix.linker }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: ${{ matrix.linker }}
          CC_aarch64_unknown_linux_musl: aarch64-linux-musl-gcc
          AR_aarch64_unknown_linux_musl: aarch64-linux-musl-ar
        run: |
          cargo build --package rfw --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/rfw rfw-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rfw-${{ matrix.arch }}
          path: rfw-${{ matrix.arch }}
          retention-days: 1

  release:
    needs: [build-agent, build-rfw]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            runman-agent-linux-amd64
            runman-agent-linux-arm64
            install.sh
            rfw-amd64
            rfw-arm64
          generate_release_notes: true
