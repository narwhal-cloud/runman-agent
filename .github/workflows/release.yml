name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-agent:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Agent
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build \
            -tags containers_image_openpgp \
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o runman-agent-linux-${{ matrix.goarch }} \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: runman-agent-linux-${{ matrix.goarch }}
          path: runman-agent-linux-${{ matrix.goarch }}
          retention-days: 1

  build-rfw:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64

    steps:
      - uses: actions/checkout@v7
        with:
          repository: narwhal-cloud/rfw
          ref: dev

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd python3-pip
          pip3 install --break-system-packages ziglang cargo-zigbuild 2>/dev/null || pip3 install ziglang cargo-zigbuild

      - name: Setup Rust toolchain
        run: |
          rustup toolchain install stable
          rustup toolchain install nightly --component rust-src
          rustup target add --toolchain stable ${{ matrix.target }}

      - name: Install bpf-linker
        run: |
          mkdir -p ~/.cargo/bin
          curl -fsSL https://github.com/aya-rs/bpf-linker/releases/download/v0.11.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst | zstd -d | tar -x -C ~/.cargo/bin
          if [ -d ~/.cargo/bin/bpf-linker-* ]; then
            cp -f ~/.cargo/bin/bpf-linker-*/bpf-linker ~/.cargo/bin/ 2>/dev/null || true
          fi
          chmod +x ~/.cargo/bin/bpf-linker
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build rfw
        run: |
          cargo zigbuild --package rfw --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/rfw rfw-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rfw-${{ matrix.arch }}
          path: rfw-${{ matrix.arch }}
          retention-days: 1

  release:
    needs: [build-agent, build-rfw]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            runman-agent-linux-amd64
            runman-agent-linux-arm64
            install.sh
            rfw-amd64
            rfw-arm64
          generate_release_notes: true

      - name: Create rolling continuous release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete continuous --yes 2>/dev/null || true
          git push origin :refs/tags/continuous 2>/dev/null || true
          gh release create continuous \
            runman-agent-linux-amd64 \
            runman-agent-linux-arm64 \
            install.sh \
            rfw-amd64 \
            rfw-arm64 \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Continuous (main)" \
            --notes "Rolling release from the latest main branch commit (${GITHUB_SHA})."
